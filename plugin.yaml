manifest_version: 1
name: loopdy
label: bighelp
kind: platform
version: "3.30.0"
license: Apache-2.0
description: >
  The bighelp app's plugin for Hermes: native cards, Feed, Ideas and Goals,
  iPhone tools, live voice, files, provider usage, secure input and optional
  end-to-end encrypted notifications. Hermes keeps owning chats, tools and
  approvals.
author: bighelp contributors
config_schema:
  templates_allow_create_agent:
    type: bool
    default: false
    label: Agents can make agents from templates
    description: >
      Lets agents make a new agent from a bighelp Template Catalog template
      (bighelp_templates_create_agent). Hermes still asks you to approve each
      one. Off by default.
optional_env:
  - LOOPDY_HOME_TARGET
  - BIGHELP_WORKSPACE_GIT_CONFIG
  - LOOPDY_APNS_TEAM_ID
  - LOOPDY_APNS_KEY_ID
  - LOOPDY_APNS_TOPIC
  - LOOPDY_APNS_ENVIRONMENT
  - LOOPDY_APNS_KEY_PATH
provides_hooks:
  # Only baseline hooks belong here: older Hermes validates these names before use.
  # on_room_member_activity is registered when the runtime advertises it.
  - pre_approval_request
  - pre_llm_call
  - post_llm_call
  # pre_tool_call is a legacy fallback only; modern hosts use tool_request.
  - post_tool_call
  - on_session_end
  - subagent_start
  - subagent_stop
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
provides_tools:
  - iphone_health
  - iphone_calendar
  - iphone_reminders
  - iphone_location
  - iphone_appearance
  - iphone_contacts
  - iphone_photos
  - iphone_geofences
  - iphone_alarms
  - iphone_music
  - iphone_focus
  - iphone_shortcuts
  - bighelp_render_summary
  - bighelp_render_metrics
  - bighelp_render_list
  - bighelp_render_timeline
  - bighelp_render_weather_forecast
  - bighelp_render_sports_game
  - bighelp_render_stock_quote
  - bighelp_render_chart
  - bighelp_render_dashboard
  - bighelp_render_form
  - bighelp_await_form_response
  - bighelp_render_card
  - bighelp_render_checklist
  - bighelp_render_selection
  - bighelp_render_automation
  - bighelp_search_card_templates
  - bighelp_get_card_template
  - bighelp_render_card_template
  - bighelp_save_ui_template
  - bighelp_react_to_message
  - bighelp_request_secure_input
  - bighelp_board
  - bighelp_people
  - bighelp_templates_search
  - bighelp_templates_get
  - bighelp_templates_fill
  - bighelp_templates_create_agent
  - bighelp_workflows
  - bighelp_catalog_login
  - bighelp_submit_catalog_template
platforms:
  - linux
  - macos
  - windows
