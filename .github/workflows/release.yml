name: Release
# A merge to main that bumps the plugin version publishes it as a GitHub Release.
# The bighelp app and `hermes bighelp update` install the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
