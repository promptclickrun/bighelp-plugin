name: Release
# The maintainer starts this when a batch of merged changes is ready:
#   gh workflow run release.yml                      # the release
#   gh workflow run release.yml -f prerelease=true   # a test release first, if you want one
# It publishes the version in plugin.yaml from the commit that set that version. Only the
# files in release-files.txt go into the release: the script commits them to the
# `releases` branch and tags that commit. The bighelp app and `hermes bighelp update`
# install the latest release, so a release reaches every host. A test release
# (v<version>-rc.<n>) is a GitHub pre-release, which they never install.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Test release (v<version>-rc.<n>) that the app and hosts don't offer
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Finding the commit that set the version needs the history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py ${{ inputs.prerelease && '--prerelease' || '' }}
