name: Release files
# Each pull request must still make a release that holds only what hosts need
# (release-files.txt), so a new file or a broken import shows here, not on release day.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_publish_release -v
      - run: python scripts/publish_release.py --export "$RUNNER_TEMP/release" --source HEAD
